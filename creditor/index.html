<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5"><title>Creditor Register</title><link rel="icon" href="../icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
:root{--bg:#f5f7fb;--card:#fff;--t:#16202e;--m:#64748b;--l:#e3e8f0;--p:#4f46e5;--p2:#7c3aed;--red:#e5484d;--grn:#16a34a;--sh:0 1px 2px #0f172a0d,0 6px 18px #0f172a10;--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#0d1320;--card:#182030;--t:#e7ecf5;--m:#94a3b8;--l:#2a364d;--p:#8b93ff;--p2:#a78bfa;--sh:0 1px 2px #0006}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;background:var(--bg);color:var(--t)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;min-height:44px;background:var(--p);color:#fff;font-weight:600}
button:disabled{opacity:.5}button.alt{background:transparent;color:var(--p);border:1.5px solid var(--p)}
button.sm{min-height:0;padding:3px 10px;font-size:12px;background:transparent;color:var(--red);border:1.5px solid var(--red);border-radius:8px}
svg{flex:none}#nav{display:flex;align-items:center;gap:4px;background:var(--card);padding:8px 16px;box-shadow:var(--sh);position:sticky;top:0;z-index:5;overflow-x:auto}
.brand{font-weight:800;color:var(--p);margin-right:12px;white-space:nowrap}.sp{flex:1}a.nv{text-decoration:none}
.nv{background:none;color:var(--m);display:flex;align-items:center;gap:6px;padding:8px 12px;min-height:40px;white-space:nowrap}
.nv.on{background:color-mix(in srgb,var(--p) 14%,transparent);color:var(--p)}#tabs{display:none}
main{max-width:1060px;margin:auto;padding:18px 16px 40px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}.ph h1{margin:0;font-size:26px;line-height:1.2}.ph p{margin:2px 0 0;color:var(--m);font-size:14px}
.help{width:38px;min-height:38px;padding:0;border-radius:50%;background:var(--card);color:var(--p);border:1.5px solid var(--l)}
.hb{background:color-mix(in srgb,var(--p) 10%,var(--card));border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:14px}
.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:var(--sh)}
.hero span{opacity:.85;font-size:14px}.hero b{display:block;font-size:34px;margin:2px 0;line-height:1.15}.hero small{opacity:.9}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.qa button{background:var(--card);color:var(--t);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;font-size:13px}.qa svg{color:var(--p)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card,.box{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}.box{padding:16px;margin-bottom:14px}
.card span{color:var(--m);font-size:13px}.card b{display:block;font-size:20px}h3{margin:18px 0 8px}
label{display:block;font-size:13px;font-weight:600;color:var(--m);margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;font:inherit;font-size:16px;border:1.5px solid var(--l);border-radius:12px;background:var(--card);color:var(--t);min-height:44px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--p);outline-offset:1px}input[type=checkbox]{width:auto;min-height:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar>*{flex:1 1 140px;width:auto}.bar button{flex:0 0 auto}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}.pick{display:flex;gap:8px}.pick button{white-space:nowrap}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
th,td{padding:10px 12px;border-bottom:1px solid var(--l);text-align:left;white-space:nowrap}th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--m)}.n{text-align:right}
.void{opacity:.5;text-decoration:line-through}.pill{padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}.pill.Credit{background:var(--red)}.pill.Repayment{background:var(--grn)}
.cr{color:var(--red);font-weight:700}.rp{color:var(--grn);font-weight:700}.chip{padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700}
.chip.owe{background:#e5484d22;color:var(--red)}.chip.ok{background:#16a34a22;color:var(--grn)}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;margin-right:10px;vertical-align:middle}
.dl tbody tr{cursor:pointer}.dl tbody tr:hover{background:color-mix(in srgb,var(--p) 6%,var(--card))}
details{background:var(--card);border-radius:12px;box-shadow:var(--sh);margin:6px 0;padding:6px 12px}details details{margin-left:8px}summary{cursor:pointer;padding:6px 0}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:20;padding:10px}
#modal .box{width:100%;max-width:480px;max-height:90vh;overflow:auto;margin:0}
.mi{display:flex;align-items:center;gap:12px;width:100%;margin:6px 0;justify-content:flex-start}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--grn);color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:30;max-width:92vw;box-shadow:var(--sh)}
#toast.show{display:block}#toast.err{background:var(--red)}#load{position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--p),var(--p2));display:none;z-index:40}
#tip{position:fixed;display:none;background:#0f172a;color:#fff;padding:8px 11px;border-radius:10px;font-size:13px;max-width:240px;z-index:60;pointer-events:none;box-shadow:var(--sh)}
.empty{padding:28px;text-align:center;color:var(--m)}a{color:var(--p)}
.login{max-width:380px;margin:40px auto;text-align:center}.login h1{margin:8px 0 2px}.login .sub{color:var(--m);margin:0 0 6px}.login label{text-align:left}.login button.go{width:100%}
.logo{width:56px;height:56px;border-radius:16px;margin:auto;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2))}
@media(max-width:760px){
#nav{display:none}#tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);box-shadow:0 -2px 14px #0f172a22;z-index:10;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#tabs button{flex:1;background:none;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 0;min-height:52px}#tabs button.on{color:var(--p)}
main{padding:14px 12px calc(92px + env(safe-area-inset-bottom))}.ph h1{font-size:22px}#toast{bottom:92px}.hero b{font-size:30px}
#modal{align-items:flex-end;padding:0}#modal .box{border-radius:20px 20px 0 0;max-width:none;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
form.box p>button{width:100%}.pick{flex-wrap:nowrap}
.tl table,.tl tbody,.dl table,.dl tbody{display:block;background:none;box-shadow:none}.tl thead,.dl thead{display:none}
.tl tr,.dl tr{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:2px;background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:12px;margin:8px 0}
.tl td,.dl td{border:0;padding:0;white-space:normal}td:empty{display:none}
.tl .c-d{grid-column:1;grid-row:1;font-weight:700}.tl .c-cr,.tl .c-rp{grid-column:2;grid-row:1;font-size:17px;text-align:right}
.tl .c-dt{grid-column:1;grid-row:2;color:var(--m);font-size:13px}.tl .c-ty{grid-column:2;grid-row:2;justify-self:end}
.tl .c-ds{grid-column:1/-1;grid-row:3;color:var(--m);font-size:14px}.tl .c-b{grid-column:1;grid-row:4;font-size:13px;color:var(--m);text-align:left}.tl .c-b:not(.v)::before{content:"Balance after: "}
.tl .c-by{display:none}.tl .c-ac{grid-column:2;grid-row:4;justify-self:end}
.dl .c-d{grid-column:1;grid-row:1;display:flex;align-items:center;font-weight:700}.dl .c-ph{grid-column:1;grid-row:2;color:var(--m);font-size:13px;padding-left:44px}
.dl .c-b{grid-column:2;grid-row:1/3;align-self:center}.dl .c-dt,.dl .c-ac{display:none}}
</style></head><body>
<div id="load"></div><nav id="nav" aria-label="Main"></nav><main id="main"></main><nav id="tabs" aria-label="Main tabs"></nav><div id="tip"></div>
<div id="modal" role="dialog" aria-modal="true"></div><div id="toast" role="status"></div>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NAV=[['dashboard','Dashboard','home','Overview: totals, outstanding debt and latest activity','Home'],['debtors','Debtors','users','Find, add and open customers who owe you money','Debtors'],['credit','Add Credit','plus','Record money or goods given on credit','Credit'],['repay','Record Repayment','check','Record a payment received from a customer','Repay'],['history','History','clock','All credits and payments by year, month and day','History'],['reports','Reports','chart','Balances, statements and monthly totals (CSV export)','Reports'],['settings','Settings','gear','Your password, currency and users','Settings']];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
let S={debtors:[],tx:[],settings:{Currency:'',TimeZone:'Europe/Copenhagen'},user:''},ST={},RB={},DN={},view='dashboard',cur=null,busy=0,TID='';
let HF={debtor:'',type:'',from:'',to:'',q:'',sort:'date'},R={t:'outstanding',from:'',to:'',debtor:''},LAST=null;
const fmt=m=>(m/100).toLocaleString('da-DK',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+(S.settings.Currency||'');
const money=m=>esc(fmt(m));
const toMinor=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:Math.round(n*100)};
const uid=()=>'T'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,8).toUpperCase();
const nowL=()=>new Date().toLocaleString('sv-SE',{timeZone:S.settings.TimeZone}).replace(' ','T').slice(0,16);
const dtv=id=>$('#'+id).value.replace('T',' ')+':00';
function load(d){busy+=d?1:-1;$('#load').style.display=busy>0?'block':'none'}
function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'err show':'show';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',4500)}
const API_URL=window.CREDITOR_API||'';let TOKEN=localStorage.getItem('creditor_token')||'';
async function run(fn,...a){load(1);try{const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action:fn,token:TOKEN,args:a})});const j=await r.json();load(0);
 if(j.ok)return j.data;if(j.code==='AUTH'&&fn!=='login'){TOKEN='';localStorage.removeItem('creditor_token');showLogin()}toast(j.error||'Error',1);return null}catch(e){load(0);toast('Network error: '+e.message,1);return null}}
function calc(){ST={};RB={};DN={};S.debtors.forEach(d=>{DN[d.DebtorID]=d.FullName;ST[d.DebtorID]={c:0,r:0,nc:0,nr:0}});
 S.tx.filter(t=>t.Status!=='Voided').sort((a,b)=>(a.TransactionDateTime+a.CreatedAt).localeCompare(b.TransactionDateTime+b.CreatedAt)).forEach(t=>{
 const s=ST[t.DebtorID]||(ST[t.DebtorID]={c:0,r:0,nc:0,nr:0});if(t.TransactionType==='Credit'){s.c+=t.CreditAmount;s.nc++}else{s.r+=t.RepaymentAmount;s.nr++}RB[t.TransactionID]=s.c-s.r})}
const bal=id=>ST[id]?ST[id].c-ST[id].r:0;
async function refresh(r=true){const d=await run('getData');if(d){S=d;calc()}if(r)render()}
function go(v){view=v;render();scrollTo(0,0)}
function openP(id){cur=id;go('profile')}
function render(){if(!TOKEN)return showLogin();const act=view==='profile'?'debtors':view,T=['dashboard','debtors','credit','repay'];
 $('#nav').innerHTML='<span class=brand>Creditor Register</span>'+NAV.map(n=>`<button class="nv ${act===n[0]?'on':''}" data-tip="${esc(n[3])}" onclick="go('${n[0]}')">${ICON[n[2]]}<span>${n[1]}</span></button>`).join('')+`<span class=sp></span><a class=nv href="../" data-tip="Back to Time Register">${ICON.clock}<span>Time Register</span></a><button class=nv data-tip="Sign out on this device" onclick=logout()>${ICON.out}<span>Log out</span></button>`;
 $('#tabs').innerHTML=NAV.filter(n=>T.includes(n[0])).map(n=>`<button class="${act===n[0]?'on':''}" data-tip="${esc(n[3])}" onclick="go('${n[0]}')">${ICON[n[2]]}<span>${n[4]}</span></button>`).join('')+`<button class="${T.includes(act)?'':'on'}" data-tip="History, reports, settings and log out" onclick=moreMenu()>${ICON.more}<span>More</span></button>`;
 let x=V[view]();if(view!=='settings')x=x.replace(/<h2>.*?<\/h2>/,'');$('#main').innerHTML=head()+x;if(I[view])I[view]()}
const card=(l,v,t)=>`<div class=card${t?` data-tip="${esc(t)}"`:''}><span>${l}</span><b>${v}</b></div>`;
const empty=m=>`<div class=empty>${m}</div>`;
function txTable(l,showD=1){if(!l.length)return empty('No transactions yet.');
 return `<div class="sc tl"><table><thead><tr><th>Date/time${showD?'<th>Debtor':''}<th>Type<th>Description<th class=n>Credit<th class=n>Repayment<th class=n>Balance after<th>By<th></tr></thead><tbody>`+
 l.map(t=>{const v=t.Status==='Voided';return `<tr class="${v?'void':''}"><td class=c-dt>${esc(t.TransactionDateTime.slice(0,16))}${showD?`<td class=c-d><a href=# onclick="openP('${esc(t.DebtorID)}');return false">${esc(DN[t.DebtorID]||t.DebtorID)}</a>`:''}<td class=c-ty><span class="pill ${t.TransactionType}">${t.TransactionType}</span><td class=c-ds>${esc(t.Description||t.ReferenceNumber)}<td class="c-cr n cr">${t.CreditAmount?money(t.CreditAmount):''}<td class="c-rp n rp">${t.RepaymentAmount?money(t.RepaymentAmount):''}<td class="c-b n ${v?'v':''}">${v?'Voided':RB[t.TransactionID]!==undefined?money(RB[t.TransactionID]):''}<td class=c-by>${esc(t.RecordedBy)}<td class=c-ac>${v||S.role!=='admin'?'':`<button class=sm data-tip="Cancel this entry (a reason is required)" onclick="voidTx('${esc(t.TransactionID)}')">Void</button>`}`}).join('')+'</tbody></table></div>'}
const byNew=l=>l.slice().sort((a,b)=>(b.TransactionDateTime+b.CreatedAt).localeCompare(a.TransactionDateTime+a.CreatedAt));
async function voidTx(id){const r=prompt('Reason for voiding (required). The entry stays in the ledger but is excluded from totals.');if(!r||!r.trim())return;
 if(await run('voidTransaction',id,r)){toast('Transaction voided');refresh()}}
const dlOpts=()=>S.debtors.filter(d=>d.Status!=='Inactive').sort((a,b)=>a.FullName.localeCompare(b.FullName)).map(d=>`<option value="${esc(d.FullName)} · ${esc(d.DebtorID)}">`).join('');
const label=id=>DN[id]+' · '+id;
function pickHtml(id,lbl){return `<label for=${id}>${lbl}</label><div class=pick><input id=${id} list=dlist placeholder="Type name or ID" autocomplete=off><button type=button class=alt data-tip="Create a new debtor without leaving this form" onclick="debtorModal(null,'${id}')">+ New</button></div>`}
function pickId(id){const v=$('#'+id).value.trim();const m=v.match(/· (D[0-9A-F]+)$/);if(m&&DN[m[1]])return m[1];
 const f=S.debtors.filter(d=>d.DebtorID===v||d.FullName.toLowerCase()===v.toLowerCase());return f.length===1?f[0].DebtorID:''}
const V={
dashboard(){const ds=S.debtors,ids=ds.map(d=>d.DebtorID);const tc=ids.reduce((a,i)=>a+ST[i].c,0),tr=ids.reduce((a,i)=>a+ST[i].r,0);const out=ids.filter(i=>bal(i)>0).length;
 return `<div class=hero><span>Total outstanding</span><b>${money(tc-tr)}</b><small>${out} of ${ds.length} debtors still owe money</small></div>
 <div class=qa><button data-tip="Record money or goods given on credit" onclick="go('credit')">${ICON.plus}<span>Add credit</span></button><button data-tip="Record a payment received" onclick="go('repay')">${ICON.check}<span>Repayment</span></button><button data-tip="Register a new customer" onclick="debtorModal()">${ICON.users}<span>New debtor</span></button></div>
 <div class=cards>${card('Credit issued',money(tc),'Everything given on credit so far')+card('Repaid',money(tr),'Everything received back')+card('Owing',out,'Debtors with a balance to pay')+card('Settled',ds.length-out,'Debtors with zero balance')}</div><h3>Recent activity</h3>${txTable(byNew(S.tx).slice(0,8))}`},
debtors(){return `<h2>Debtors</h2><div class=bar><input id=q type=search placeholder="Search name, phone or ID" aria-label="Search debtors" oninput=dList()><button data-tip="Register a new customer" onclick="debtorModal()">+ Add debtor</button></div><div id=dl2></div>`},
profile(){const d=S.debtors.filter(x=>x.DebtorID===cur)[0];if(!d)return empty('Debtor not found');const s=ST[cur];
 return `<h2>${esc(d.FullName)}</h2><div class=bar><button data-tip="Give this debtor credit" onclick="go('credit');setTimeout(()=>pre('c_d'),0)">Add credit</button><button data-tip="Record a payment from this debtor" onclick="go('repay');setTimeout(()=>pre('r_d'),0)">Repayment</button><button class=alt data-tip="Change name, phone, address or notes" onclick="debtorModal('${cur}')">Edit</button><button class=alt data-tip="See every transaction, grouped by date" onclick="HF.debtor='${cur}';go('history')">History</button></div>
 <div class=cards>${card('Credit received',money(s.c))+card('Repaid',money(s.r))+card('Outstanding',money(s.c-s.r))+card('Credit entries',s.nc)+card('Repayments',s.nr)}</div>
 <div class=box><p><b>ID:</b> ${esc(d.DebtorID)} · <b>Phone:</b> ${esc(d.PhoneNumber)} · <b>Registered:</b> ${esc(d.CreatedAt)}</p><p><b>Address:</b> ${esc(d.Address)}</p><p><b>Added by:</b> ${esc(d.AddedBy)}</p><p><b>Notes:</b> ${esc(d.Notes)}</p></div>
 <h3>Transactions</h3>${txTable(byNew(S.tx.filter(t=>t.DebtorID===cur)),0)}`},
credit(){TID=TID||uid();return `<h2>Add Credit</h2><form class=box onsubmit="saveCredit();return false"><datalist id=dlist>${dlOpts()}</datalist>${pickHtml('c_d','Debtor *')}
 <div class=row><div><label for=c_dt>Date and time</label><input id=c_dt type=datetime-local value="${nowL()}" required></div><div><label for=c_type>Type</label><select id=c_type onchange=cType()><option value=Money>Money credit</option><option value=Item>Item credit</option></select></div></div>
 <label for=c_desc>Description / item details</label><input id=c_desc>
 <div class=row id=itemF style="display:none"><div><label for=c_qty>Quantity</label><input id=c_qty type=number step=any min=0 oninput=calcAmt()></div><div><label for=c_unit>Unit price</label><input id=c_unit inputmode=decimal oninput=calcAmt()></div><div><label><input id=c_adj type=checkbox style="width:auto" onchange=calcAmt()> Manual total (explain in Notes)</label></div></div>
 <div class=row><div><label for=c_amt>Amount *</label><input id=c_amt inputmode=decimal required></div><div><label for=c_by>Recorded by</label><input id=c_by value="${esc(S.user)}"></div></div>
 <label for=c_notes>Notes</label><textarea id=c_notes rows=2></textarea><p><button id=c_save>Save credit</button></p></form>`},
repay(){TID=TID||uid();return `<h2>Record Repayment</h2><form class=box onsubmit="saveRepay();return false"><datalist id=dlist>${dlOpts()}</datalist>${pickHtml('r_d','Debtor *')}<div class=cards id=r_info style="margin-top:10px"></div>
 <div class=row><div><label for=r_dt>Date and time</label><input id=r_dt type=datetime-local value="${nowL()}" required></div><div><label for=r_amt>Repayment amount *</label><input id=r_amt inputmode=decimal required></div>
 <div><label for=r_m>Payment method</label><select id=r_m><option>Cash</option><option>Card</option><option>Bank transfer</option><option>MobilePay</option><option>Other</option></select></div><div><label for=r_ref>Reference / receipt no.</label><input id=r_ref></div><div><label for=r_by>Recorded by</label><input id=r_by value="${esc(S.user)}"></div></div>
 <label for=r_notes>Notes</label><textarea id=r_notes rows=2></textarea><p><button id=r_save>Save repayment</button></p></form>`},
history(){return `<h2>Transaction History</h2><datalist id=dlist>${dlOpts()}</datalist><div class=bar><input id=h_d list=dlist placeholder="Debtor (all)" oninput=hist()><select id=h_t onchange=hist()><option value="">All types<option>Credit<option>Repayment</select><input id=h_f type=date onchange=hist() aria-label=From><input id=h_to type=date onchange=hist() aria-label=To><input id=h_q type=search placeholder="Search ID, name, description, reference" oninput=hist()><select id=h_s onchange=hist()><option value=date>Sort: date<option value=amount>Sort: amount<option value=debtor>Sort: debtor</select><button class=alt data-tip="Download these rows for Excel or Sheets" onclick=histCsv()>Export CSV</button></div><div id=h_out></div>`},
